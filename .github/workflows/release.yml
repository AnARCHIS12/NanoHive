name: Create GitHub release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['docs/releases/*.md']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          fetch-tags: true

      - name: Create or update release from notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$REF_TYPE" = "tag" ]; then
            tags="$REF_NAME"
          else
            tags=$(git diff --name-only HEAD~1 HEAD -- 'docs/releases/*.md' | xargs -r -n1 basename | sed 's/\.md$//')
          fi
          for tag in $tags; do
            notes="docs/releases/${tag}.md"
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "Tag $tag does not exist yet, skipping"
              continue
            fi
            if [ -f "$notes" ]; then
              notes_args="--notes-file $notes"
            else
              notes_args="--generate-notes"
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              if [ -f "$notes" ]; then
                gh release edit "$tag" --title "$tag" --notes-file "$notes"
              fi
            else
              gh release create "$tag" --verify-tag --title "$tag" $notes_args
            fi
          done
