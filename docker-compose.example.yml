services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    # ...votre configuration ABS normale (volumes, etc.)...
    # Aucun port exposé publiquement si seul le proxy du thème communique avec.
    expose:
      - "80"

  abs-theme:
    image: ghcr.io/rodzalendo/nanohive-abs-theme:latest
    # Ou build local:  build: .
    restart: unless-stopped
    depends_on:
      - audiobookshelf
    ports:
      - "13379:80"
    volumes:
      # Volume persistant pour les données locales du thème :
      # logos, jaquettes de séries, préférences et notes internes éventuelles.
      - nh_theme_data:/data/nh
    environment:
      ABS_UPSTREAM: "http://audiobookshelf:80"

      # Paramètres optionnels par défaut :
      # NH_APP_NAME: "Ma Bibliothèque"
      # NH_ACCENT_COLOR: "#e0c27a"
      # NH_BASE_THEME: "warm"        # warm slate black navy mocha pine plum crimson ocean sand steel wine
      # NH_FONT_SCALE: "1.0"
      # NH_CAROUSEL_TIMING: "15"     # secondes par slide hero ; 0 désactive le défilement auto
      # NH_RECENT_SERIES_COUNT: "12"
      # NH_CUSTOM_SERIES_CARDS: "true"
      # NH_SHOW_HERO_CAROUSEL: "true"
      # NH_SHOW_RATINGS: "true"      # notes locales internes uniquement
      # NH_GLOBAL_SEARCH: "true"

# Dirigez votre navigateur / reverse-proxy TLS vers le conteneur abs-theme (port 13379)
volumes:
  nh_theme_data:
