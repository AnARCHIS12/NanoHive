services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    # ...standard Audiobookshelf configuration (volumes, etc.)...
    # No exposed host ports needed if the theme proxy handles all client traffic.
    expose:
      - "80"

  abs-theme:
    image: ghcr.io/anarchis12/nanohive:latest
    # Or build locally: build: .
    restart: unless-stopped
    depends_on:
      - audiobookshelf
    ports:
      - "13379:80"
    volumes:
      # Persistent storage for local theme data:
      # custom logo, series covers, server preferences, local ratings.
      - nh_theme_data:/data/nh
    environment:
      ABS_UPSTREAM: "http://audiobookshelf:80"

      # Optional parameters:
      # NH_APP_NAME: "My Library"
      # NH_ACCENT_COLOR: "#e0c27a"
      # NH_BASE_THEME: "warm"        # warm slate black navy mocha pine plum crimson ocean sand steel wine
      # NH_FONT_SCALE: "1.0"
      # NH_CAROUSEL_TIMING: "15"     # seconds per hero slide; 0 disables auto-advance
      # NH_RECENT_SERIES_COUNT: "12"
      # NH_CUSTOM_SERIES_CARDS: "true"
      # NH_SHOW_HERO_CAROUSEL: "true"
      # NH_SHOW_RATINGS: "true"      # local self-hosted ratings only
      # NH_GLOBAL_SEARCH: "true"

# Point your browser or external TLS reverse proxy to port 13379
volumes:
  nh_theme_data:
